<h2>Cash Drawer - <span th:text="${store.name}"></span></h2>
<form th:action="@{/manager/cash/action}" method="post">
  <select name="type"><option>IN</option><option>OUT</option><option>OPEN</option><option>CLOSE</option></select>
  <input name="amount" type="number" step="0.01"/>
  <input name="note" placeholder="Reason"/>
  <button>Submit</button>
</form>

<table>
  <tr th:each="l : ${logs}">
    <td th:text="${l.type}"></td><td th:text="${l.amount}"></td><td th:text="${l.user.username}"></td>
  </tr>
</table>
