<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{partials/_header :: common_header(~{::title/text()},~{::link},~{::meta})}">
    <!-- Custom meta data for this template-->
    <meta name="description" content="meo home page">
    <meta name="author" content="mfano">
    <!-- Custom title for this page-->
    <title>MPOS | Edit Product</title>
    <!-- Custom styles for this page-->
</th:block>

<body>

    <!-- ======= Header ======= -->
    <th:block th:insert="~{partials/_topbar}" />
    <!-- =====End Header===== -->

    <!-- ======= Sidebar ======= -->
    <th:block th:insert="~{partials/_sidebar}" />
    <!-- =====End Sidebar=====-->


    <main id="main" class="main">

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 class="mb-1">
                                    <i class="bi bi-pencil"></i>
                                    Edit Product
                                </h4>
                                <small class="text-muted">
                                    Update product information
                                </small>
                            </div>
                            <a th:href="@{/products}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left"></i>
                                Back
                            </a>
                        </div>
                    </div>

                    <form th:action="@{/products/update/{id}(id=${products.id})}" th:object="${product}" method="post"
                        enctype="multipart/form-data">
                        <div class="card-body">
                            <div class="row g-3">

                                <!-- NAME -->
                                <div class="col-12">
                                    <label class="form-label">
                                        Product Name
                                    </label>
                                    <input type="text" th:field="*{name}" class="form-control" required>
                                </div>

                                <!-- SKU -->
                                <div class="col-md-6">
                                    <label class="form-label">
                                        SKU
                                    </label>
                                    <input type="text" th:field="*{sku}" class="form-control" required>
                                </div>

                                <!-- PRICE -->
                                <div class="col-md-6">
                                    <label class="form-label">
                                        Price
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            KSh
                                        </span>
                                        <input type="number" th:field="*{price}" class="form-control" step="0.01"
                                            min="0" required>
                                    </div>
                                </div>

                                <!-- STOCK -->
                                <div class="col-md-6">
                                    <label class="form-label">
                                        Quantity
                                    </label>
                                    <input type="number" th:field="*{stock}" class="form-control" min="0" required>
                                </div>

                                <!-- IMAGE -->
                                <div class="col-md-6">
                                    <label class="form-label">
                                        Image URL
                                    </label>
                                    <input type="file" th:field="image" class="form-control" accept="image/*">
                                </div>
                            </div>
                        </div>

                        <div class="card-footer bg-white text-end">
                            <a th:href="@{/products}" class="btn btn-secondary">
                                Cancel
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save"></i>
                                Update
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main><!-- End #main -->

    <!-- =====footer===== -->
    <th:block th:insert="~{partials/_footer}" />
</body>

</html>
