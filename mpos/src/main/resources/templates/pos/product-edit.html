<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Edit Product</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card border-0 shadow-sm">

                <div class="card-header bg-white py-3">

                    <div class="d-flex justify-content-between">

                        <div>

                            <h4 class="mb-1">
                                <i class="bi bi-pencil"></i>
                                Edit Product
                            </h4>

                            <small class="text-muted">
                                Update product information
                            </small>

                        </div>

                        <a th:href="@{/products}"
                           class="btn btn-outline-secondary">

                            <i class="bi bi-arrow-left"></i>
                            Back

                        </a>

                    </div>

                </div>


                <form th:action="@{/products/update/{id}(id=${product.id})}"
                      th:object="${product}"
                      method="post">

                    <div class="card-body">

                        <div class="row g-3">


                            <!-- NAME -->

                            <div class="col-12">

                                <label class="form-label">
                                    Product Name
                                </label>

                                <input type="text"
                                       th:field="*{name}"
                                       class="form-control"
                                       required>

                            </div>


                            <!-- SKU -->

                            <div class="col-md-6">

                                <label class="form-label">
                                    SKU
                                </label>

                                <input type="text"
                                       th:field="*{sku}"
                                       class="form-control"
                                       required>

                            </div>


                            <!-- PRICE -->

                            <div class="col-md-6">

                                <label class="form-label">
                                    Price
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        KSh
                                    </span>

                                    <input type="number"
                                           th:field="*{price}"
                                           class="form-control"
                                           step="0.01"
                                           min="0"
                                           required>

                                </div>

                            </div>


                            <!-- STOCK -->

                            <div class="col-md-6">

                                <label class="form-label">
                                    Stock Quantity
                                </label>

                                <input type="number"
                                       th:field="*{stockQuantity}"
                                       class="form-control"
                                       min="0"
                                       required>

                            </div>


                            <!-- IMAGE -->

                            <div class="col-md-6">

                                <label class="form-label">
                                    Image URL
                                </label>

                                <input type="text"
                                       th:field="*{image}"
                                       class="form-control">

                            </div>


                            <!-- ACTIVE -->

                            <div class="col-12">

                                <div class="form-check form-switch">

                                    <input type="checkbox"
                                           th:field="*{active}"
                                           class="form-check-input">

                                    <label class="form-check-label">

                                        <strong>Active Product</strong>

                                        <br>

                                        <small class="text-muted">
                                            Inactive products will not be available for sale.
                                        </small>

                                    </label>

                                </div>

                            </div>

                        </div>

                    </div>


                    <div class="card-footer bg-white text-end">

                        <a th:href="@{/products}"
                           class="btn btn-secondary">

                            Cancel

                        </a>

                        <button type="submit"
                                class="btn btn-primary">

                            <i class="bi bi-save"></i>
                            Update Product

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
