<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{partials/_header :: common_header(~{::title/text()},~{::link},~{::meta})}">
  <!-- Custom meta data for this template-->
  <meta name="description" content="meo home page">
  <meta name="author" content="mfano">
  <!-- Custom title for this page-->
  <title>MPOS | POS</title>
  <!-- Custom styles for this page-->
</th:block>

<body>
  <!-- ======= Header ======= -->
  <th:block th:insert="~{partials/_topbar}" />
  <!-- =====End Header===== -->

  <!-- ======= Sidebar ======= -->
  <th:block th:insert="~{partials/_sidebar}" />
  <!-- =====End Sidebar=====-->

  <main id="main" class="main">

    <section class="section dashboard d-flex flex-column min-vh-100">
      <div class="container-fluid">
        <!-- PAGE HEADER -->
        <div class="pagetitle d-flex justify-content-between align-items-center mb-4">
          <div>
            <h1 class="fw-bold mb-1">
              <i class="bi bi-shop"></i>
              MPOS
            </h1>
          </div>

          <!-- Breadcrumb -->
          <nav>
            <ol class="breadcrumb">
              <li class="breadcrumb-item">
                <a th:href="@{/}">
                  <i class="bi bi-house-door me-1"></i>
                  Dashboard
                </a>
              </li>
              <li class="breadcrumb-item">
                <a th:href="@{/}">Cashier</a>
              </li>
              <li class="breadcrumb-item active" aria-current="page">POS</li>
            </ol>
          </nav>
        </div><!-- End Page Title -->

        <div class="row align-items-start">
          <!-- Product Grid -->
          <div class="col-lg-8 col-md-7">
            <!-- Search and Filter -->
            <div class="row mb-4 justify-content-between">

              <!-- Search -->
              <div class="col-xxl-8 col-xl-8 col-lg-8 col-md-6 col-sm-7">
                <div class="input-group">
                  <span class="input-group-text">
                    <i class="bi bi-search"></i>
                  </span>

                  <input type="text" id="tableSearch" class="form-control" placeholder="Search products..."
                    autocomplete="off">
                </div>
              </div>

              <!-- Filter -->
              <div class="col-xxl-4 col-xl-4 col-lg-4 col-md-6 col-sm-5 text-end">
                <div class="dropdown">
                  <button type="button" class="btn btn-outline-warning dropdown-toggle" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    <i class="bi bi-filter me-1"></i> Filter
                  </button>

                  <div class="dropdown-menu dropdown-menu-end shadow">
                    <h6 class="dropdown-header">Filter By Category</h6>

                    <a class="dropdown-item" th:href="@{/records/documents(filter='today')}">
                      Today
                    </a>

                    <a class="dropdown-item" th:href="@{/records/documents(filter='month')}">
                      This Month
                    </a>

                    <a class="dropdown-item" th:href="@{/records/documents(filter='year')}">
                      This Year
                    </a>

                    <div class="dropdown-divider"></div>

                    <a class="dropdown-item" th:href="@{/records/documents}">
                      All Categories
                    </a>
                  </div>
                </div>
              </div>
            </div>

            <!-- Products -->
            <div class="row" id="productsGrid">

              <div class="col-6 col-sm-4 col-lg-3 mb-3 product-item" th:each="p : ${products}"
                th:attr="data-name=${p.name},data-sku=${p.sku}">

                <div class="card h-100 border-0 shadow-sm product-card" role="button" tabindex="0"
                  style="cursor: pointer;" th:onclick="|document.getElementById('form-${p.id}').requestSubmit()|"
                  onkeydown="if(event.key === 'Enter' || event.key === ' ') { event.preventDefault(); this.click(); }">

                  <!-- Product Image -->
                  <img th:src="${p.image == null or p.image.isEmpty()}
                             ? @{/image/product-2.jpg}
                             : @{/products/{product}(product=${p.image})}" class="card-img-top"
                    style="height: 150px; object-fit: cover;" th:alt="${p.name}">

                  <!-- Product Details -->
                  <div class="card-body">
                    <p class="card-title text-truncate" th:text="${p.name}"></p>

                    <p class="text-success fw-bold mb-1">
                      Ksh
                      <span th:text="${#numbers.formatDecimal(p.price, 1, 'COMMA', 2, 'POINT')}"></span>
                    </p>

                    <small class="text-muted text-truncate d-block" th:text="${p.sku}"></small>
                  </div>

                  <!-- Add to Cart -->
                  <form th:id="|form-${p.id}|" th:action="@{/pos/cart/add}" method="post">
                    <input type="hidden" name="productId" th:value="${p.id}">

                    <input type="hidden" name="quantity" value="1">

                  </form>
                </div>
              </div>
            </div>

            <!-- No results -->
            <div id="noProductsFound" class="text-center text-muted py-4" style="display:none;">
              <i class="bi bi-search fs-3"></i>
              <p class="mb-0">No products found.</p>
            </div>

            <!-- EMPTY -->
            <div th:if="${#lists.isEmpty(products)}">
              <div class="text-center py-5">
                <i class="bi bi-box-seam fs-1 text-muted"></i>
                <h5 class="mt-3">
                  No products found
                </h5>
                <p class="text-muted">
                  Add your first product to get started.
                </p>
              </div>
            </div>
          </div>

          <!-- Cart -->
          <div class="col-lg-4 col-md-5 bg-white p-4 shadow">
            <h2 class="h4 fw-bold mb-4">Cart</h2>
            <div th:each="item : ${cart.items}" class="d-flex justify-content-between align-items-center mb-3">
              <div>
                <small class="text-muted" th:text="${item.product.name}">
                </small>
                <span> x </span>
                <span th:text="${item.quantity + ' @' + item.product.price}"></span>
              </div>
              <div class="d-flex align-items-center gap-2"> <span class="text-muted"
                  th:text="'Ksh ' + ${#numbers.formatDecimal(item.subtotal, 1, 'COMMA', 2, 'POINT')}"> Ksh 0.00 </span>
                <!-- Remove Item -->
                <form th:action="@{/pos/cart/remove/{id}(id=${item.id})}" method="post" class="m-0"> <button
                    type="submit" class="btn btn-sm btn-outline-danger" title="Remove item"> <i class="bi bi-trash"></i>
                  </button> </form>
              </div>
            </div>

            <hr>

            <div class="d-flex justify-content-between"
              th:if="${cart != null && cart.items != null && !cart.items.isEmpty()}">
              <span class="fs-4 fw-bold">Total</span>
              <span class="fs-4 text-sm text-success"
                th:text="'Ksh ' + ${#numbers.formatDecimal(cart.getTotal(), 1, 'COMMA', 2, 'POINT')}"></span>
              </span>
            </div>

            <!-- EMPTY -->
            <div th:if="${cart.items.isEmpty()}">
              <div class="text-center py-5">
                <i class="bi bi-box-seam fs-1 text-muted"></i>
                <h5 class="mt-3">
                  No items found in cart.
                </h5>
                <p class="text-muted">
                  Add your first item to get started.
                </p>
              </div>
            </div>

            <!-- Checkout -->
            <form th:action="@{/pos/checkout}" method="post" class="mt-4">
              <label class="form-label fw-semibold">
                Payment Method
              </label>
              <select name="paymentMethod" class="form-select mb-3">
                <option value="CASH">Cash</option>
                <option value="CARD">Card</option>
                <option value="MPESA">M-PESA</option>
                <option value="AIRTEL">Airtel Money</option>
              </select>

              <button type="submit" class="btn btn-success w-100 py-2">
                Checkout
              </button>
            </form>
          </div>
        </div>
      </div>
    </section>

  </main><!-- End #main -->

  <!-- =====footer===== -->
  <th:block th:insert="~{partials/_footer}" />
</body>

</html>
