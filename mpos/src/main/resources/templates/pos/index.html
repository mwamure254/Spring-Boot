<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{partials/_header :: common_header(~{::title/text()},~{::link},~{::meta})}">
  <!-- Custom meta data for this template-->
  <meta name="description" content="meo home page">
  <meta name="author" content="mfano">
  <!-- Custom title for this page-->
  <title>MPOS | Sales</title>
  <!-- Custom styles for this page-->
</th:block>

<body>

  <!-- ======= Header ======= -->
  <th:block th:insert="~{partials/_topbar}" />
  <!-- =====End Header===== -->

  <!-- ======= Sidebar ======= -->
  <th:block th:insert="~{partials/_sidebar}" />
  <!-- =====End Sidebar=====-->

  <main id="main" class="main">

    <div class="pagetitle">
      <h1>Dashboard</h1>
      <nav>
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">Home</a></li>
          <li class="breadcrumb-item active">Dashboard</li>
        </ol>
      </nav>
    </div><!-- End Page Title -->

    <section class="section dashboard">

      <div class="flex h-screen">
        <!-- Product Grid -->
        <div class="w-2/3 p-4 overflow-y-auto">
          <h1 class="text-2xl font-bold mb-4">Products</h1>
          <div class="grid grid-cols-4 gap-4">
            <div th:each="p : ${products}" class="bg-white p-3 rounded shadow hover:shadow-lg cursor-pointer"
              onclick="document.getElementById('form-[[${p.id}]]').submit()">
              <img th:src="${p.image}" class="h-24 mx-auto" />
              <p class="font-semibold" th:text="${p.name}"></p>
              <p class="text-green-600" th:text="'KES ' + ${p.price}"></p>
              <form th:id="'form-' + ${p.id}" th:action="@{/pos/cart/add}" method="post">
                <input type="hidden" name="productId" th:value="${p.id}" />
              </form>
            </div>
          </div>
        </div>

        <!-- Cart -->
        <div class="w-1/3 bg-white p-4 shadow-lg">
          <h2 class="text-xl font-bold mb-4">Cart</h2>
          <div th:each="item : ${cart.items}" class="flex justify-between mb-2">
            <span th:text="${item.product.name} + ' x' + ${item.qty}"></span>
            <span th:text="'KES ' + ${item.total}"></span>
          </div>
          <hr class="my-2" />
          <p class="text-2xl font-bold" th:text="'Total: KES ' + ${cart.grandTotal}"></p>

          <form th:action="@{/pos/checkout}" method="post" class="mt-4">
            <select name="paymentMethod" class="w-full border p-2 rounded">
              <option value="CASH">Cash</option>
              <option value="CARD">Card</option>
              <option value="MPESA">M-PESA</option>
              <option value="AIRTEL">Airtel Money</option>
            </select>
            <button class="w-full bg-green-600 text-white p-3 rounded mt-2">Checkout</button>
          </form>
        </div>
      </div>

    </section>

  </main><!-- End #main -->

  <!-- =====footer===== -->
  <th:block th:insert="~{partials/_footer}" />
</body>

</html>
