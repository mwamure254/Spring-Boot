<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{partials/_header :: common_header(~{::title/text()},~{::link},~{::meta})}">
  <!-- Custom meta data for this template-->
  <meta name="description" content="meo home page">
  <meta name="author" content="mfano">
  <!-- Custom title for this page-->
  <title>MPOS | Sales</title>
  <!-- Custom styles for this page-->
</th:block>

<body>
  <!-- ======= Header ======= -->
  <th:block th:insert="~{partials/_topbar}" />
  <!-- =====End Header===== -->

  <!-- ======= Sidebar ======= -->
  <th:block th:insert="~{partials/_sidebar}" />
  <!-- =====End Sidebar=====-->

  <main id="main" class="main">
    <div class="pagetitle">
      <h1>POS</h1>
      <nav>
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">Home</a></li>
          <li class="breadcrumb-item active">Dashboard</li>
        </ol>
      </nav>
    </div><!-- End Page Title -->

    <section class="section">
      <div class="container-fluid">
        <div class="row align-items-start">

          <!-- Product Grid -->
          <div class="col-lg-8 col-md-7 p-4">
            <h1 class="h3 fw-bold mb-4">Products</h1>

            <div class="row row-cols-2 row-cols-sm-3 row-cols-md-3 row-cols-lg-4 g-3">
              <div class="col" th:each="p : ${products}">
                <div class="card h-100 shadow-sm border-0 product-card" style="cursor:pointer;"
                  th:onclick="'document.getElementById(\'form-' + ${p.id} + '\').submit()'">

                  <img th:src="${p.image == null or p.image.isEmpty()}
                                ? @{/image/products/product-2.jpg}
                                : @{/image/products/{product}(product=${p.image})}" class="card-img-top"
                    style="height:140px; object-fit:cover;" alt="Product">

                  <div class="card-body p-3">
                    <h6 class="card-title text-truncate mb-1" th:text="${p.name}">
                    </h6>
                    <p class="text-success text-sm mb-0" th:text="'KES: ' + ${p.price}">
                    </p>
                  </div>

                  <form th:id="'form-' + ${p.id}" th:action="@{/pos/cart/add}" method="post">
                    <input type="hidden" name="productId" th:value="${p.id}">
                  </form>
                </div>
              </div>
            </div>
          </div>

          <!-- Cart -->
          <div class="col-lg-4 col-md-5 bg-white p-4 shadow">
            <h2 class="h4 fw-bold mb-4">Cart</h2>
            <div th:each="item : ${cart.items}" class="d-flex justify-content-between align-items-center mb-3">
              <div>
                <span class="fw-semibold" th:text="${item.product.name}">
                </span>
                <small class="text-muted" th:text="' x' + ${item.qty}">
                </small>
              </div>
              <span class="fw-semibold" th:text="'KES ' + ${item.total}">
              </span>
            </div>

            <hr>

            <div class="d-flex justify-content-between" th:if="${cart != null || !cart.isEmpty}">
              <span class="fs-4 fw-bold">Total</span>
              <span class="fs-4 text-sm text-success" th:text="'KES: ' + ${cart.getTotal()}">
              </span>
            </div>

            <!-- Checkout -->
            <form th:action="@{/pos/checkout}" method="post" class="mt-4">
              <label class="form-label fw-semibold">
                Payment Method
              </label>
              <select name="paymentMethod" class="form-select mb-3">
                <option value="CASH">Cash</option>
                <option value="CARD">Card</option>
                <option value="MPESA">M-PESA</option>
                <option value="AIRTEL">Airtel Money</option>
              </select>

              <button type="submit" class="btn btn-success w-100 py-2">
                Checkout
              </button>
            </form>
          </div>
        </div>
      </div>
    </section>

  </main><!-- End #main -->

  <!-- =====footer===== -->
  <th:block th:insert="~{partials/_footer}" />
</body>

</html>
