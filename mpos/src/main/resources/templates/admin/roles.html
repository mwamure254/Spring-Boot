<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{partials/_header :: common_header(~{::title/text()},~{::link},~{::meta})}">
	<!-- Custom meta data for this template-->
	<meta name="description" content="meo home page">
	<meta name="author" content="mfano">
	<!-- Custom title for this page-->
	<title>MoE | Manage Roles</title>
	<!-- Custom styles for this page-->
</th:block>

<body>

  <!-- ======= Header ======= -->
  <th:block th:insert="~{partials/_topbar}" />
  <!-- =====End Header===== -->

  <!-- ======= Sidebar ======= -->
  <th:block th:insert="~{partials/_sidebar}" />
  <!-- =====End Sidebar=====-->

	<!-- ======Main===== -->
	<main id="main" class="main">

		<div class="pagetitle my-4">
			<h3>User <span th:text="${user.id}"></span> Role Dashboard</h3>

			<nav class="bg-dark">
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a href="/">Home</a></li>
					<li class="breadcrumb-item active">Dashboard</li>
				</ol>
			</nav>
		</div><!-- End Page Title -->

		<section class="section dashboard">
			<div class="row">
				<h4>Details and Assigned Roles</h4>
				<div class="col-lg-6">
					<div class="panel">
						<div class="panel-body border">

							<div class="row">
								<div class="col-lg-3 col-md-4 label">#ID</div>
								<div class="col-lg-9 col-md-8" th:text="${user.id}">id</div>
							</div>

							<div class="row">
								<div class="col-lg-3 col-md-4 label">#Email</div>
								<div class="col-lg-9 col-md-8" th:text="${user.email}">name@example.com</div>
							</div>

							<form class="py-4" th:action="@{'/admin/profile/'+${user.id}}" method="get">
								<button type="submit" class="btn btn-sm btn-primary">
									<i class="bi bi-arrow-up-right mx-2"></i>GO TO PROFILE</button>
							</form>
						</div>
					</div>
				</div>
				<div class="col-lg-6">
					<table class="table table-striped table-advance table-hover">
						<tbody>
							<tr>
								<th>#</th>
								<th><i class="icon_profile"></i> Role</th>
								<th><i class="icon_cogs"></i> Action</th>
							</tr>
							<tr th:each="userRole, stat:${userRoles}">
								<td th:text="${stat.count}">1</td>
								<td th:text="${userRole.name}"></td>
								<td>
									<form th:action="@{'/admin/remove-role/'+${user.id}+'/' +${userRole.id}}"
										onclick="return confirm('Are you sure you want to unassign?')" method="post" data-bs-toggle="modal" data-bs-target="#u"
										title="unassign role">
										<button type="submit" class="btn btn-sm btn-danger">
											<i class="bi bi-dash"></i>Remove</button>
									</form>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</section>
		<br>
		<br>
		<section class="panel">
			<h4>
				Roles user <span th:text="${user.id}"></span> is not Assigned
			</h4>
			<div class="panel-body">
				<table class="table table-striped table-advance table-hover">
					<tbody>
						<tr>
							<th>#</th>
							<th><i class="icon_profile"></i> Role</th>
							<th><i class="icon_calendar"></i> Description</th>
							<th><i class="icon_cogs"></i> Action</th>
						</tr>
						<tr th:each="userNotRole, stat:${userNotRoles}">
							<td th:text="${stat.count}">1</td>
							<td th:text="${userNotRole.name}"></td>
							<td th:text="${userNotRole.description}"></td>
							<td>
								<div class="btn-group">
									<form th:action="@{'/admin/assign-role/'+${user.id}+'/' +${userNotRole.id}}"
										onclick="return confirm('confirm to assign role')" method="post"
										class="mx-2" data-bs-toggle="modal" data-bs-target="#u" title="assign role">
										<button type="submit" class="btn btn-sm btn-success"><i
												class="bi bi-plus"></i>Assign</button>
									</form>

									<a class="btn btn-sm btn-warning" data-bs-toggle="modal" data-bs-target="#u"
										title="edit role"><i class="bi bi-pen"></i>Edit</a>

									<form th:action="@{'/admin/delete-role/'+${user.id}+'/' +${userNotRole.id}}"
										onclick="return confirm('confirm to delete role')" method="post"
										class="mx-2" data-bs-toggle="modal" data-bs-target="#u" title="delete role">
										<button type="submit" class="btn btn-sm btn-danger"><i
												class="bi bi-x"></i>Delete</button>
									</form>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>

	</main><!-- =====End #main===== -->

	<!-- =====footer===== -->
	<th:block th:insert="~{partials/_footer}" />
</body>

</html>
